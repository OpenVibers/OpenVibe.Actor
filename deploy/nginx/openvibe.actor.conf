## ═══════════════════════════════════════════════════════════════
## openvibe.actor — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.actor.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 4950, systemd unit openvibe-actor) renders every page and serves the
## task API; nginx terminates TLS, redirects www → apex, rate-limits sign-in and the API, keeps a task's live stream
## unbuffered and compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the pages rendered for anonymous
## visitors; private, no-store for everything personal). Never log request bodies here: tasks are people's words.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovactor_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovactor_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ovactor_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.actor www.openvibe.actor;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.actor$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.actor;

    ssl_certificate     /etc/letsencrypt/live/openvibe.actor/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.actor/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.actor$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.actor;

    ssl_certificate     /etc/letsencrypt/live/openvibe.actor/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.actor/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.actor.access.log;
    error_log  /var/log/nginx/openvibe.actor.error.log;

    # A task is at most 20000 characters; the API's JSON cap is 64 KB.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=ovactor_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4950;
    }

    location /auth/ {
        limit_req zone=ovactor_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4950;
    }

    # ── A task's live stream: server-sent events, never buffered, held open between heartbeats ──
    location ~ ^/api/v1/tasks/[^/]+/events$ {
        limit_req zone=ovactor_api burst=20 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
        proxy_pass http://127.0.0.1:4950;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=ovactor_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4950;
    }

    # ── The task form and cancel (POST /tasks, /tasks/:id/cancel) ──
    location ~ ^/tasks {
        limit_req zone=ovactor_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4950;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4950/metrics) ──
    location = /metrics { return 404; }

    # ── OpenVibe.Events' delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:4950/internal/events directly. Never proxied from outside (ADR-033).
    location /internal/ { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:4950;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
